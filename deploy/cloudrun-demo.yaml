# Cloud Run — T1 bounded public demo swaps (docs/TESTNET_PUBLIC_SWAPS.md).
#
# This is NOT the publication freeze profile. It deliberately reverses parts of
# ADR-U4: the service holds spendable TESTNET keys and broadcasts transactions.
# Diff vs deploy/cloudrun.yaml (the read-only freeze):
#
#   freeze (cloudrun.yaml)          demo (this file)
#   ----------------------          ----------------
#   LABD_PUBLIC_READ_ONLY=1         LABD_PUBLIC_READ_ONLY=1  (unchanged)
#   no demo mutations               fixed T1 swap + RGB lab exact paths
#   no secrets                      Secret Manager volume at /secrets (read-only)
#   no volumes                      persistent GCS volume at /data  (budget + sessions)
#   min 0 / max 1                   min 1 / max 1            <-- refund watcher must keep running
#   runtime SA: no roles            runtime SA: secretAccessor + storage on ONE bucket
#
# FULL ROLLBACK = replace this SAME service with
# deploy/cloudrun-demo-freeze.yaml, then route 100% of traffic to latest.
# deploy/cloudrun.yaml names a different service (rgbmvp-public) and cannot
# roll back rgbmvp-demo.
#
# Mainnet is refused at config load regardless of anything here.
#
# Prerequisites (see deploy/README.md "T1 demo swap deployment"):
#   - Secret Manager: rgbmvp-demo-btc-alice-wif, rgbmvp-demo-bob-mnemonic,
#     rgbmvp-demo-bob-descriptor, rgbmvp-demo-exit-seed,
#     rgbmvp-demo-liquid-watch-bundle (watch-only; no spending keys)
#   - GCS bucket for the persistent volume (versioning ON)
#   - Turnstile secret: rgbmvp-demo-turnstile-secret
#   - Runtime SA rgbmvp-demo-run@PROJECT.iam.gserviceaccount.com

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: rgbmvp-demo
  annotations:
    run.googleapis.com/description: "rgbmvp T1 — bounded public testnet demo swaps"
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        # min=1: the W5 refund watcher and the in-memory quota state must stay
        # alive. At min=0 a scale-to-zero mid-swap strands funds in an HTLC
        # until the next cold start, and CSV timers go unobserved.
        autoscaling.knative.dev/minScale: "1"
        # max=1: the fee budget and concurrency limiter are per-instance, so a
        # second instance would double the effective spend ceiling.
        autoscaling.knative.dev/maxScale: "1"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/cpu-throttling: "false"
    spec:
      # Dedicated identity: Secret Manager accessor + the single data bucket.
      # No other project roles.
      serviceAccountName: rgbmvp-demo-run@PROJECT.iam.gserviceaccount.com
      # Low concurrency: swap execution is serialized by the governor anyway.
      containerConcurrency: 20
      timeoutSeconds: 300
      volumes:
        # W3 — signing material, injected at runtime, never in the image.
        - name: wallet-secrets
          secret:
            secretName: rgbmvp-demo-btc-alice-wif
            items:
              - key: latest
                path: btc-alice/wif
                mode: 0400
        - name: wallet-secrets-lq
          secret:
            secretName: rgbmvp-demo-bob-mnemonic
            items:
              - key: latest
                path: bob/mnemonic
                mode: 0400
        - name: wallet-descriptor-lq
          secret:
            secretName: rgbmvp-demo-bob-descriptor
            items:
              - key: latest
                path: bob/descriptor
                mode: 0400
        - name: demo-exit-seed
          secret:
            secretName: rgbmvp-demo-exit-seed
            items:
              - key: latest
                path: demo-exits/seed
                mode: 0400
        # Public board only: xpub derivation + SLIP77 blinding material. This
        # bundle can reveal the five predefined testnet wallet balances but
        # cannot sign. Pin the reviewed version for deterministic rollback.
        - name: liquid-watch-bundle
          secret:
            secretName: rgbmvp-demo-liquid-watch-bundle
            items:
              - key: "1"
                path: liquid-watch.json
                mode: 0400
        # W4 — persistent state for write-ahead reservations and sessions.
        # Corrupt or unavailable budget state makes T1 refuse startup.
        - name: demo-data
          csi:
            driver: gcsfuse.run.googleapis.com
            volumeAttributes:
              bucketName: PROJECT-rgbmvp-demo-data
              # Swap sessions contain a private preimage. Cloud Storage FUSE
              # controls permissions at mount time and does not support normal
              # per-object chmod, so the mount itself must present files 0600.
              # Dockerfile.public runs as Debian's nobody (65534:65534).
              mountOptions: uid=65534,gid=65534,file-mode=600,dir-mode=700
      containers:
        - image: REGION-docker.pkg.dev/PROJECT/rgbmvp/rgbmvp-public:TAG
          ports:
            - name: http1
              containerPort: 8080
          volumeMounts:
            - name: wallet-secrets
              mountPath: /secrets
              readOnly: true
            - name: wallet-secrets-lq
              mountPath: /secrets-lq
              readOnly: true
            - name: wallet-descriptor-lq
              mountPath: /secrets-lq-descriptor
              readOnly: true
            - name: demo-exit-seed
              mountPath: /secrets-exits
              readOnly: true
            - name: liquid-watch-bundle
              mountPath: /secrets-watch
              readOnly: true
            - name: demo-data
              mountPath: /data
          env:
            # --- U4 posture retained ---
            - name: LABD_PUBLIC_READ_ONLY
              value: "1"
            - name: RGBMVP_NETWORK
              value: liquid-testnet
            - name: LABD_WEB_DIR
              value: /app/web
            - name: LABD_ARTIFACTS_DIR
              value: /app/artifacts/public
            # --- W4: persistent, write-ahead state (NOT /tmp) ---
            - name: RGBMVP_DATA_DIR
              value: /data
            - name: RGBMVP_WALLET_DIR
              value: /data/wallets
            - name: RGBMVP_CONSIGNMENT_DIR
              value: /data/consignments
            # --- W3: custody. Startup REFUSES to run if this is unset on a
            # public bind, or if a mounted key is group/world readable.
            # Colon-separated: Cloud Run gives each Secret Manager entry its own
            # volume/mountPath, so one directory cannot hold both keys. ---
            - name: RGBMVP_SECRET_DIR
              value: /secrets:/secrets-lq:/secrets-lq-descriptor:/secrets-exits
            # Display-only watch bundle. Deliberately outside
            # RGBMVP_SECRET_DIR so no signing path can resolve it.
            - name: RGBMVP_LIQUID_WATCH_BUNDLE
              value: /secrets-watch/liquid-watch.json
            - name: LABD_WALLET_BALANCE_TTL_SECS
              value: "120"
            - name: LABD_WALLET_BALANCE_MAX_STALE_SECS
              value: "900"
            # --- T1: the bounded public trigger ---
            - name: LABD_DEMO_SWAPS
              value: "1"
            - name: LABD_DEMO_TURNSTILE_REQUIRED
              value: "1"
            # Public sitekey — ships in the HTML, served by /v1/demo/quota.
            # Replace with the value from your Turnstile widget.
            - name: LABD_DEMO_TURNSTILE_SITEKEY
              value: TURNSTILE_SITEKEY
            # Siteverify must echo action=rgbmvp_demo_swap and one of these
            # exact DNS names. No schemes, ports, paths, or wildcards.
            - name: LABD_DEMO_TURNSTILE_HOSTNAMES
              value: TURNSTILE_HOSTNAMES
            - name: LABD_DEMO_TURNSTILE_SECRET
              valueFrom:
                secretKeyRef:
                  name: rgbmvp-demo-turnstile-secret
                  key: latest
            # --- Anonymous RGB lab: one fixed Issue -> Transfer -> Verify run.
            # Uses the same widget and secret but requires action=rgbmvp_rgb_lab.
            # Its quota ledger is /data/rgb_demo_budget.json, independent of T1. ---
            - name: LABD_RGB_DEMO
              value: "1"
            - name: LABD_RGB_DEMO_MAX_COST_SATS
              value: "2500"
            - name: LABD_RGB_DEMO_BUDGET_SATS
              value: "25000"
            - name: LABD_RGB_DEMO_DAILY_CAP
              value: "2"
            - name: LABD_RGB_DEMO_MIN_INTERVAL_SECS
              value: "600"
            - name: LABD_RGB_DEMO_PER_IP_HOURLY
              value: "1"
            - name: LABD_RGB_DEMO_PER_IP_DAILY
              value: "1"
            - name: LABD_RGB_DEMO_LQ_FLOOR_SATS
              value: "20000"
            # Google External Application Load Balancers append
            # client-ip,load-balancer-ip. Discard the one trusted right-edge
            # proxy entry and select the next-to-last IP. Verify this exact
            # topology during acceptance; direct/unexpected paths fail closed.
            - name: LABD_XFF_TRUSTED_HOPS
              value: "1"
            # --- Budget (docs/TESTNET_PUBLIC_SWAPS.md §1a) ---
            - name: LABD_DEMO_LEG_SATS
              value: "1000"
            # Fees: repo-proven values, measured live at 5.25 / 3.63 sat/vB
            # (docs/T1_FIRST_SWAP.md). An earlier draft used 200/100 from vbyte
            # arithmetic (~1.4 sat/vB) which risks sitting unconfirmed.
            - name: LABD_DEMO_BTC_FEE_SATS
              value: "800"
            - name: LABD_DEMO_BTC_CLAIM_FEE_SATS
              value: "500"
            - name: LABD_DEMO_BTC_SWEEP_FEE_SATS
              value: "500"
            - name: LABD_DEMO_LQ_FEE_SATS
              value: "300"
            # MUST cover fund + claim/refund + exit sweep. labd refuses an
            # under-reserving configuration at startup.
            - name: LABD_DEMO_MAX_FEE_SATS
              value: "1800"
            - name: LABD_DEMO_FEE_BUDGET_SATS
              value: "28000"
            - name: LABD_DEMO_DAILY_CAP
              value: "6"
            - name: LABD_DEMO_MAX_CONCURRENT
              value: "1"
            - name: LABD_DEMO_MIN_INTERVAL_SECS
              value: "600"
            - name: LABD_DEMO_PER_IP_HOURLY
              value: "1"
            - name: LABD_DEMO_PER_IP_DAILY
              value: "2"
            - name: LABD_DEMO_BTC_FLOOR_SATS
              value: "5000"
            - name: LABD_DEMO_LQ_FLOOR_SATS
              value: "20000"
            # --- W5: refund watcher ---
            - name: LABD_DEMO_SWEEP_INTERVAL_SECS
              value: "900"
            - name: LABD_DEMO_SWEEP_MIN_AGE_SECS
              value: "5400"
            - name: LABD_DEMO_LQ_SWEEP_FEE_SATS
              value: "400"
            - name: LABD_VERIFY_RATE_LIMIT
              value: "30"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /v1/health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /v1/health
            periodSeconds: 60
            failureThreshold: 3
